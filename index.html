<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FazAYou Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            position: relative;
        }

        /* FOTO BACKGROUND */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://files.catbox.moe/njfos1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        /* Overlay gelap biar teks jelas */
        #video-background::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }
        
        .profile-container {
            text-align: center;
            z-index: 1;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            max-width: 90%;
            width: 380px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 5px 0;
            font-size: 1.9rem;
            letter-spacing: 1.5px;
            font-weight: 600;
        }
        
        h2 {
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .audio-container {
            margin: 10px 0 15px;
            display: flex;
            justify-content: center;
        }

        audio {
                width: 180px;
                height: 34px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .social-btn {
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .youtube { background-color: #FF0000; }
        .instagram { background: linear-gradient(45deg, #405DE6, #833AB4, #E1306C); }
        .tiktok { background-color: #000000; }
        .github { background-color: #333333; }
        .telegram { background-color: #0088cc; }
        .whatsapp { background-color: #25D366; }

        @media (max-width: 480px) {
            .social-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- FOTO BACKGROUND -->
    <div id="video-background"></div>
    
    <div class="profile-container">
        <img src="https://files.catbox.moe/hqage9.png" alt="Profile" class="profile-pic">
        <h1>F4NZ クラ</h1>
        <h2>No noise, only progress</h2>
        
        <div class="audio-container">
            <audio controls>
                <source src="https://files.catbox.moe/iovjj6.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="social-buttons">
            <a href="https://youtube.com/@faz4youu" target="_blank" class="social-btn youtube"><i class="fab fa-youtube"></i> YOUTUBE</a>
            <a href="https://www.instagram.com/f4nz60?igsh=MWp5Z3BtcmljMXVuag==" target="_blank" class="social-btn instagram"><i class="fab fa-instagram"></i> INSTAGRAM</a>
            <a href="https://www.tiktok.com/@faz4yousquad" target="_blank" class="social-btn tiktok"><i class="fab fa-tiktok"></i> TIKTOK</a>
            <a href="https://github.com/FAZ4YOU" target="_blank" class="social-btn github"><i class="fab fa-github"></i> GITHUB</a>
            <a href="https://t.me/faz4youmarketplace" target="_blank" class="social-btn telegram"><i class="fab fa-telegram"></i> TELEGRAM</a>
            <a href="https://whatsapp.com/channel/0029VbB8wfsKLaHpHVOi8g0l" class="social-btn whatsapp"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
        </div>
    </div>

</body>
    </html>
